ktor {
  deployment {
    port = 8080
    port = ${?PORT}
  }
  application {
    modules = [com.khan366kos.integration.studio.ktor.server.app.ApplicationKt.module]
  }
}

database {
  url      = ${?DB_URL}
  user     = ${?DB_USER}
  password = ${?DB_PASSWORD}
  pool-size = 10
  pool-size = ${?DB_POOL_SIZE}
}

rabbitmq {
  host        = "localhost"
  host        = ${?RABBITMQ_HOST}
  port        = 5672
  port        = ${?RABBITMQ_PORT}
  vhost       = "/"
  vhost       = ${?RABBITMQ_VHOST}
  user        = "guest"
  user        = ${?RABBITMQ_USER}
  password    = "guest"
  password    = ${?RABBITMQ_PASSWORD}
  exchange    = "integration.events"
  exchange    = ${?RABBITMQ_EXCHANGE}
  routing-key = "stream.events"
  routing-key = ${?RABBITMQ_ROUTING_KEY}
}

email {
  enabled   = false
  enabled   = ${?EMAIL_ENABLED}
  smtp-host = "smtp.example.com"
  smtp-host = ${?EMAIL_SMTP_HOST}
  smtp-port = 587
  smtp-port = ${?EMAIL_SMTP_PORT}
  smtp-tls  = true
  smtp-tls  = ${?EMAIL_SMTP_TLS}
  from      = ${?EMAIL_FROM}
  password  = ${?EMAIL_PASSWORD}
  to        = ${?EMAIL_TO}
}

sync-scheduler {
  enabled           = false
  enabled           = ${?SYNC_SCHEDULER_ENABLED}
  interval-minutes  = 15
  interval-minutes  = ${?SYNC_INTERVAL_MINUTES}
  scope-type-id     = 0
  scope-type-id     = ${?SYNC_SCOPE_TYPE_ID}
  scope-object-id   = 0
  scope-object-id   = ${?SYNC_SCOPE_OBJECT_ID}
  service-user      = ${?SYNC_USER}
  service-password  = ${?SYNC_PASS}
  service-storage-id = ${?SYNC_STORAGE_ID}
  external-api-timezone-offset-minutes = 0
  external-api-timezone-offset-minutes = ${?SYNC_EXTERNAL_API_TZ_OFFSET_MINUTES}
}
