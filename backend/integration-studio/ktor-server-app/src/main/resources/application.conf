ktor {
  deployment {
    port = 8080
    port = ${?PORT}
  }
  application {
    modules = [com.khan366kos.integration.studio.ktor.server.app.ApplicationKt.module]
  }
}

database {
  url      = ${?DB_URL}
  user     = ${?DB_USER}
  password = ${?DB_PASSWORD}
  pool-size = 10
  pool-size = ${?DB_POOL_SIZE}
}

rabbitmq {
  host        = "localhost"
  host        = ${?RABBITMQ_HOST}
  port        = 5672
  port        = ${?RABBITMQ_PORT}
  vhost       = "/"
  vhost       = ${?RABBITMQ_VHOST}
  user        = "guest"
  user        = ${?RABBITMQ_USER}
  password    = "guest"
  password    = ${?RABBITMQ_PASSWORD}
  exchange    = "integration.events"
  exchange    = ${?RABBITMQ_EXCHANGE}
  routing-key = "stream.events"
  routing-key = ${?RABBITMQ_ROUTING_KEY}
}
